aid: chronicled
name: Chronicled
description: 'Chronicled is a San Francisco technology company that builds and administers
  the blockchain-powered MediLedger Network, a decentralized platform that automates
  business-rule enforcement and trusted data exchange between trading partners in the
  pharmaceutical and life sciences supply chain. Its solutions span DSCSA-compliant
  product verification, contracts and chargebacks, gross-to-net (GPO roster and rebate)
  reconciliation, and customer master data management for manufacturers, wholesalers,
  distributors, health systems, and group purchasing organizations. Chronicled publishes
  no public API, developer portal, or OpenAPI; it operates a private B2B network and
  is backed by Pantera Capital.'
